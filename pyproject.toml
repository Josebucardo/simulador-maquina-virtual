[project]
name = "vm-studio-grupo13"
version = "1.0.0"
description = "Máquina virtual didáctica con GUI, consola y reportes reproducibles"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
documentos = ["reportlab>=4,<6", "python-docx>=1,<2", "pypdfium2>=4,<6"]

[project.scripts]
